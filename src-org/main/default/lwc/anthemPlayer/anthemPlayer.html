<template>
    <lightning-card title="Anthem Player">
        <div class="slds-p-around_medium">
            <!-- Play Button -->
            <lightning-button 
                icon-name="utility:play" 
                label="Generate & Play Anthem" 
                variant="brand"
                onclick={handlePlay}
                disabled={isLoading}
                class="slds-m-bottom_large">
            </lightning-button>
            
            <!-- Error Display -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <lightning-icon icon-name="utility:error" alternative-text="Error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <strong>Error:</strong> {error}
                </div>
            </template>
            
            <!-- Audio Information Display -->
            <template if:true={anthemData}>
                <div class="slds-box slds-theme_default slds-m-top_large">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">🎵 Anthem Audio Information</h3>
                    
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                            <p class="slds-text-body_small">
                                <strong>Audio Channels:</strong> {audioChannels}
                            </p>
                            <p class="slds-text-body_small">
                                <strong>Samples per Channel:</strong> {audioSamples}
                            </p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                            <p class="slds-text-body_small">
                                <strong>Duration:</strong> {audioDuration} seconds
                            </p>
                            <p class="slds-text-body_small">
                                <strong>Data Size:</strong> {dataSizeMB} MB
                            </p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
